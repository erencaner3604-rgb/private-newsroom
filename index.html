<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private News Room — Eren & Caner</title>
  
  <!-- Web Font & Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    :root {
      --bg-primary: #0a0b0d;
      --bg-card: #121418;
      --bg-card-hover: #171a20;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(212, 175, 55, 0.35);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #f0f2f5;
      --text-muted: #8a919e;
      --text-dim: #5c6370;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 11, 13, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 20px 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #1c1f26, #0e1013);
      border: 1px solid var(--border-gold);
      color: var(--gold-primary);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      letter-spacing: 1px;
    }

    .title-area h1 {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .title-area p {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
      font-size: 10px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .lang-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* KATEGORİ SCROLL BAR */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 4px;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-pill {
      white-space: nowrap;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 30px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cat-pill.active {
      background: #fff;
      color: #000;
      font-weight: 600;
      border-color: #fff;
    }

    /* HABER LİSTESİ */
    main {
      padding: 16px 20px;
      max-width: 720px;
      margin: 0 auto;
    }

    .articles-feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .article-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px 18px 14px;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .article-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meta-source {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--gold-primary);
    }

    .source-name {
      font-size: 11px;
      color: var(--text-dim);
    }

    .score-badge {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--border-gold);
      padding: 2px 7px;
      border-radius: var(--radius-sm);
    }

    .headline {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
      color: #fff;
    }

    .takeaways-box {
      background: rgba(0, 0, 0, 0.25);
      border-left: 2px solid var(--gold-primary);
      padding: 8px 12px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .takeaways-box ul {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .takeaways-box li {
      font-size: 12px;
      color: #cfd4dc;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.4;
    }

    .takeaways-box li::before {
      content: "•";
      color: var(--gold-primary);
      font-weight: bold;
    }

    .summary-text {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
      display: none;
      white-space: pre-line;
      border-top: 1px dashed var(--border-subtle);
      padding-top: 10px;
      margin-top: 4px;
    }

    .summary-text.expanded {
      display: block;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      font-size: 11px;
    }

    .read-toggle {
      background: none;
      border: none;
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .time-text {
      color: var(--text-dim);
    }

    /* SKELETON / LOADING */
    .skeleton {
      background: linear-gradient(90deg, #121418 25%, #1c1f26 50%, #121418 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: var(--radius-md);
      height: 130px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* BOTTOM NAV */
    nav.bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(10, 11, 13, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      max-width: 720px;
      margin: 0 auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      background: none;
      border: none;
    }

    .nav-item.active {
      color: var(--gold-primary);
    }

    .nav-item .material-symbols-outlined {
      font-size: 22px;
    }
  </style>

  <!-- Firebase App & Firestore SDKs (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="top-bar">
      <div class="brand-group">
        <div class="brand-badge">E&C</div>
        <div class="title-area">
          <h1>Private News Room</h1>
          <p id="clock-display">Canlı İstihbarat</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="pulse-badge">
          <span class="pulse-dot"></span>
          <span>Aktif Radar</span>
        </div>
        <button class="lang-btn" id="lang-btn">
          <span class="material-symbols-outlined" style="font-size:14px;">translate</span>
          <span id="lang-label">TR</span>
        </button>
      </div>
    </div>

    <!-- 7 STRATEJİK KATEGORİ BUTONLARI -->
    <div class="category-scroll" id="cat-scroll">
      <button class="cat-pill active" data-category="all">Tümü</button>
      <button class="cat-pill" data-category="breaking_world">Küresel Manşetler</button>
      <button class="cat-pill" data-category="economy_finance">Ekonomi & Finans</button>
      <button class="cat-pill" data-category="luxury_horology">Lüks & Saat</button>
      <button class="cat-pill" data-category="real_estate_market">Gayrimenkul</button>
      <button class="cat-pill" data-category="ai_vc_tech">Yapay Zeka & VC</button>
      <button class="cat-pill" data-category="trade_logistics">Dış Ticaret & Lojistik</button>
      <button class="cat-pill" data-category="aegean_radar">İzmir & Bodrum</button>
    </div>
  </header>

  <!-- FEED ALANI -->
  <main>
    <div class="articles-feed" id="articles-container">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </main>

  <!-- ALT MENÜ -->
  <nav class="bottom-bar">
    <button class="nav-item active" onclick="filterByNav('all')">
      <span class="material-symbols-outlined">bolt</span>
      <span>Canlı Akış</span>
    </button>
    <button class="nav-item" onclick="filterByNav('economy_finance')">
      <span class="material-symbols-outlined">payments</span>
      <span>Piyasalar</span>
    </button>
    <button class="nav-item" onclick="filterByNav('luxury_horology')">
      <span class="material-symbols-outlined">watch</span>
      <span>Lüks & Saat</span>
    </button>
    <button class="nav-item" onclick="filterByNav('aegean_radar')">
      <span class="material-symbols-outlined">explore</span>
      <span>Ege Radarı</span>
    </button>
  </nav>

  <script>
    // 1. FIREBASE CONFIG — Entegre Edildi
    const firebaseConfig = {
      apiKey: "AIzaSyCP8D0OH5AKFQdwYC_nntCEA1Gf8yYzY84",
      authDomain: "news-c0d54.firebaseapp.com",
      projectId: "news-c0d54",
      storageBucket: "news-c0d54.firebasestorage.app",
      messagingSenderId: "142483105638",
      appId: "1:142483105638:web:4cff78bab27c0e08ad8aa7",
      measurementId: "G-X73X2VJ448"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. KATEGORİ ETİKET SÖZLÜĞÜ (TR/EN)
    const CATEGORY_MAP = {
      breaking_world: { TR: "Küresel Manşetler", EN: "Breaking World" },
      economy_finance: { TR: "Ekonomi & Finans", EN: "Economy & Finance" },
      luxury_horology: { TR: "Lüks & Saatçilik", EN: "Luxury & Horology" },
      real_estate_market: { TR: "Gayrimenkul Piyasası", EN: "Real Estate Market" },
      ai_vc_tech: { TR: "Yapay Zeka & VC", EN: "AI & Tech VC" },
      trade_logistics: { TR: "Dış Ticaret & Lojistik", EN: "Trade & Logistics" },
      aegean_radar: { TR: "İzmir & Bodrum Radarı", EN: "Aegean Radar" }
    };

    let currentLang = "TR";
    let activeCategory = "all";
    let allArticles = [];

    // CANLI SAAT GÖSTERGESİ
    function updateClock() {
      const now = new Date();
      const options = { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
      document.getElementById('clock-display').innerText = now.toLocaleDateString('tr-TR', options) + " • E&C";
    }
    setInterval(updateClock, 1000);
    updateClock();

    // DİL DEĞİŞTİRME BUTONU
    document.getElementById('lang-btn').addEventListener('click', () => {
      currentLang = currentLang === "TR" ? "EN" : "TR";
      document.getElementById('lang-label').innerText = currentLang;
      renderArticles();
    });

    // KATEGORİ BUTONLARI
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.getAttribute('data-category');
        renderArticles();
      });
    });

    function filterByNav(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-category') === cat);
      });
      renderArticles();
    }

    // FIRESTORE CANLI DİNLEME (REALTIME LISTENER)
    db.collection("articles")
      .orderBy("published_at", "desc")
      .limit(60)
      .onSnapshot(snapshot => {
        allArticles = [];
        snapshot.forEach(doc => {
          allArticles.push({ id: doc.id, ...doc.data() });
        });
        renderArticles();
      }, err => {
        console.error("Firestore dinleme hatası:", err);
      });

    // KARTLARI EKRANA BASTIRMA
    function renderArticles() {
      const container = document.getElementById('articles-container');
      const filtered = activeCategory === "all" 
        ? allArticles 
        : allArticles.filter(a => a.category === activeCategory);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 40px 20px; color: var(--text-dim);">
            <span class="material-symbols-outlined" style="font-size:36px; margin-bottom:8px;">feed</span>
            <p>Bu kategoride henüz yeni bir istihbarat raporu bulunmuyor.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const trans = (item.translations && item.translations[currentLang]) 
          ? item.translations[currentLang] 
          : (item.translations?.TR || {});

        const headline = trans.headline || item.original_title || "Başlık Yok";
        const takeaways = trans.takeaways || [];
        const summary = trans.summary || "";
        const catLabel = (CATEGORY_MAP[item.category] && CATEGORY_MAP[item.category][currentLang]) 
          ? CATEGORY_MAP[item.category][currentLang] 
          : item.category;

        const timeStr = item.published_at ? new Date(item.published_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";

        return `
          <article class="article-card" id="${item.id}">
            <div class="card-top">
              <div class="meta-source">
                <span class="cat-tag">${catLabel}</span>
                <span style="color:var(--border-subtle)">•</span>
                <span class="source-name">${item.source || "Global Radar"}</span>
              </div>
              <span class="score-badge">${(item.importance_score / 10).toFixed(1)}</span>
            </div>

            <h2 class="headline">${headline}</h2>

            ${takeaways.length > 0 ? `
              <div class="takeaways-box">
                <ul>
                  ${takeaways.map(t => `<li>${t}</li>`).join('')}
                </ul>
              </div>
            ` : ''}

            <div class="summary-text" id="summary-${item.id}">
              ${summary}
            </div>

            <div class="card-footer">
              <button class="read-toggle" onclick="toggleSummary('${item.id}')">
                <span id="btn-text-${item.id}">${currentLang === 'TR' ? 'BRİFİNGİ OKU' : 'READ BRIEFING'}</span>
                <span class="material-symbols-outlined" id="arrow-${item.id}" style="font-size:14px;">arrow_forward</span>
              </button>
              <span class="time-text">${timeStr}</span>
            </div>
          </article>
        `;
      }).join('');
    }

    function toggleSummary(id) {
      const el = document.getElementById(`summary-${id}`);
      const btnText = document.getElementById(`btn-text-${id}`);
      const arrow = document.getElementById(`arrow-${id}`);
      const isExp = el.classList.toggle('expanded');

      if (isExp) {
        btnText.innerText = currentLang === 'TR' ? 'KAPAT' : 'CLOSE';
        arrow.innerText = 'arrow_upward';
      } else {
        btnText.innerText = currentLang === 'TR' ? 'BRİFİNGİ OKU' : 'READ BRIEFING';
        arrow.innerText = 'arrow_forward';
      }
    }
  </script>
</body>
</html>
