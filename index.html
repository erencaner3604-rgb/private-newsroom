<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private News Room — Eren & Caner</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    :root {
      --bg-primary: #0a0b0d;
      --bg-card: #121418;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(212, 175, 55, 0.35);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #f0f2f5;
      --text-muted: #8a919e;
      --text-dim: #5c6370;
      --accent-green: #10b981;
      --radius-sm: 8px;
      --radius-md: 14px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.5;
      padding-bottom: 90px;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 11, 13, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 20px 10px;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand-group { display: flex; align-items: center; gap: 12px; }
    .brand-badge {
      background: linear-gradient(135deg, #1c1f26, #0e1013);
      border: 1px solid var(--border-gold);
      color: var(--gold-primary);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
    }
    .title-area h1 { font-family: 'Cinzel', serif; font-size: 15px; color: #fff; text-transform: uppercase; }
    .title-area p { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .lang-btn { background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-main); font-size: 11px; padding: 5px 9px; border-radius: var(--radius-sm); cursor: pointer; display: flex; gap: 4px;}

    .category-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-pill { white-space: nowrap; background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-muted); font-size: 12px; padding: 7px 14px; border-radius: 30px; display: flex; align-items: center; gap: 6px; }
    .cat-pill.active { background: var(--gold-primary); color: #000; font-weight: 700; border-color: var(--gold-primary); }

    main { padding: 16px 20px; max-width: 720px; margin: 0 auto; }
    .section-header { margin-bottom: 12px; }
    .section-sub { font-size: 10px; font-weight: 700; color: var(--gold-primary); margin-bottom: 4px; letter-spacing: 1px;}
    .section-title { font-family: 'Cinzel', serif; font-size: 17px; color: #fff; }

    .vip-carousel { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; margin-bottom: 24px; scroll-snap-type: x mandatory; }
    .vip-card { min-width: 85%; scroll-snap-align: start; background: linear-gradient(145deg, #16181e, #101216); border: 1px solid var(--border-gold); border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; gap: 10px; }

    .articles-feed { display: flex; flex-direction: column; gap: 16px; }
    .article-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    
    /* GÖRSEL ALANI İÇİN YENİ CSS */
    .article-image { width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.05); filter: brightness(0.85); transition: var(--transition); }
    .article-image:hover { filter: brightness(1); }

    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .cat-tag { font-size: 10px; font-weight: 700; color: var(--gold-primary); text-transform: uppercase; }
    .source-name { font-size: 11px; color: var(--text-dim); }
    .score-badge { font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700; color: var(--gold-light); background: rgba(212, 175, 55, 0.12); border: 1px solid var(--border-gold); padding: 2px 7px; border-radius: var(--radius-sm); }

    .headline { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; color: #fff; line-height: 1.4; }
    .takeaways-box { background: rgba(0, 0, 0, 0.25); border-left: 2px solid var(--gold-primary); padding: 8px 12px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
    .takeaways-box ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
    .takeaways-box li { font-size: 12px; color: #cfd4dc; display: flex; gap: 6px; }
    .takeaways-box li::before { content: "•"; color: var(--gold-primary); font-weight: bold; }
    .summary-text { font-size: 13px; color: var(--text-muted); display: none; white-space: pre-line; border-top: 1px dashed var(--border-subtle); padding-top: 10px; margin-top: 4px; }
    .summary-text.expanded { display: block; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; }
    .read-toggle { background: none; border: none; color: var(--gold-light); font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    nav.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 64px; background: rgba(10, 11, 13, 0.94); backdrop-filter: blur(16px); border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-around; align-items: center; z-index: 100; max-width: 720px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-dim); font-size: 10px; background: none; border: none; cursor: pointer; }
    .nav-item.active { color: var(--gold-primary); }
    .nav-item .material-symbols-outlined { font-size: 22px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <div class="top-bar">
      <div class="brand-group">
        <div class="brand-badge">E&C</div>
        <div class="title-area">
          <h1>Private News Room</h1>
          <p>Canlı İstihbarat</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="lang-btn" id="lang-btn">
          <span class="material-symbols-outlined" style="font-size:14px;">translate</span>
          <span id="lang-label">TR</span>
        </button>
      </div>
    </div>
    <div class="category-scroll">
      <button class="cat-pill active" onclick="filterCategory('all')">Tümü</button>
      <button class="cat-pill" onclick="filterCategory('vip_10')">VIP 10</button>
      <button class="cat-pill" onclick="filterCategory('breaking_world')">Küresel Manşetler</button>
      <button class="cat-pill" onclick="filterCategory('economy_finance')">Ekonomi</button>
      <button class="cat-pill" onclick="filterCategory('luxury_horology')">Lüks & Saat</button>
      <button class="cat-pill" onclick="filterCategory('ai_vc_tech')">Yapay Zeka</button>
      <button class="cat-pill" onclick="filterCategory('aegean_radar')">Ege Radar</button>
    </div>
  </header>

  <main>
    <section id="vip-section">
      <div class="section-header">
        <div class="section-sub">GÜNÜN EN KRİTİK HABERLERİ</div>
      </div>
      <div class="vip-carousel" id="vip-carousel"></div>
    </section>

    <div class="section-header">
      <div class="section-sub">YÖNETİCİ İSTİHBARAT AKIŞI</div>
    </div>
    <div class="articles-feed" id="articles-container"></div>
  </main>

  <nav class="bottom-bar">
    <button class="nav-item active" onclick="filterCategory('all')"><span class="material-symbols-outlined">feed</span><span>Akış</span></button>
    <button class="nav-item" onclick="filterCategory('economy_finance')"><span class="material-symbols-outlined">payments</span><span>Piyasalar</span></button>
    <button class="nav-item" onclick="filterCategory('luxury_horology')"><span class="material-symbols-outlined">watch</span><span>Lüks & Saat</span></button>
    <button class="nav-item" onclick="filterCategory('aegean_radar')"><span class="material-symbols-outlined">explore</span><span>Ege Radar</span></button>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCP8D0OH5AKFQdwYC_nntCEA1Gf8yYzY84",
      authDomain: "news-c0d54.firebaseapp.com",
      projectId: "news-c0d54",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentLang = "TR";
    let activeCategory = "all";
    let allArticles = [];

    document.getElementById('lang-btn').addEventListener('click', () => {
      currentLang = currentLang === "TR" ? "EN" : "TR";
      document.getElementById('lang-label').innerText = currentLang;
      renderAll();
    });

    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill, .nav-item').forEach(b => b.classList.remove('active'));
      document.querySelectorAll(`[onclick="filterCategory('${cat}')"]`).forEach(b => b.classList.add('active'));
      renderAll();
    }

    db.collection("articles").onSnapshot(snapshot => {
      allArticles = [];
      snapshot.forEach(doc => allArticles.push({ id: doc.id, ...doc.data() }));
      allArticles.sort((a, b) => new Date(b.published_at || 0) - new Date(a.published_at || 0));
      renderAll();
    });

    function renderAll() {
      const vipCont = document.getElementById('vip-carousel');
      const feedCont = document.getElementById('articles-container');
      
      let filtered = activeCategory === 'all' ? allArticles : (activeCategory === 'vip_10' ? allArticles : allArticles.filter(a => a.category === activeCategory));
      
      const vipList = [...allArticles].sort((a, b) => (b.importance_score || 85) - (a.importance_score || 85)).slice(0, 10);
      
      vipCont.innerHTML = vipList.map((item, i) => {
        const trans = (item.translations && item.translations[currentLang]) || item.translations?.TR || {};
        return `
          <div class="vip-card">
            <div class="card-top"><span class="cat-tag">#${i+1} VIP</span><span class="score-badge">${(item.importance_score/10).toFixed(1)}</span></div>
            <h3 class="headline" style="font-size:14px;">${trans.headline || item.original_title}</h3>
          </div>`;
      }).join('');

      feedCont.innerHTML = filtered.map(item => {
        const trans = (item.translations && item.translations[currentLang]) || item.translations?.TR || {};
        const imgHtml = item.image_url ? `<img src="${item.image_url}" class="article-image" alt="Thumbnail">` : '';
        const score = item.importance_score ? (item.importance_score/10).toFixed(1) : "8.5";

        return `
          <article class="article-card">
            ${imgHtml}
            <div class="card-top">
              <div><span class="cat-tag">${item.category.replace('_', ' ')}</span></div>
              <span class="score-badge">${score}</span>
            </div>
            <h2 class="headline">${trans.headline || item.original_title}</h2>
            ${trans.takeaways ? `<div class="takeaways-box"><ul>${trans.takeaways.map(t=>`<li>${t}</li>`).join('')}</ul></div>` : ''}
            <div class="summary-text" id="sum-${item.id}">${trans.summary || ""}</div>
            <div class="card-footer">
              <button class="read-toggle" onclick="document.getElementById('sum-${item.id}').classList.toggle('expanded')">BRİFİNGİ OKU ➔</button>
            </div>
          </article>`;
      }).join('');
    }
  </script>
</body>
</html>
