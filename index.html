<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eren & Caner — Private Intelligence Terminal</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0d10;
      --card-bg: rgba(18, 22, 28, 0.75);
      --card-border: rgba(255, 255, 255, 0.07);
      --accent-gold: #c5a059;
      --accent-gold-glow: rgba(197, 160, 89, 0.15);
      --text-main: #f0f2f5;
      --text-muted: #8b949e;
      --text-sub: #adb5bd;
      --vip-badge: #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Ambient Glow */
    body::before {
      content: "";
      position: fixed;
      top: -10vw;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-gold);
      font-weight: 600;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
    }

    .lang-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .lang-btn:hover {
      border-color: rgba(197, 160, 89, 0.4);
      color: var(--text-main);
    }

    .lang-btn.active {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: #000;
      box-shadow: 0 0 15px var(--accent-gold-glow);
    }

    /* Category Filter */
    .category-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .category-filter::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* Articles Stream */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 22px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    .article-card.vip {
      border-left: 3px solid var(--accent-gold);
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 11px;
    }

    .source-tag {
      color: var(--accent-gold);
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .importance-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .importance-badge.high {
      background: rgba(197, 160, 89, 0.1);
      color: var(--vip-badge);
      border-color: rgba(197, 160, 89, 0.2);
    }

    .headline {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text-main);
      margin-bottom: 14px;
      letter-spacing: -0.2px;
    }

    .takeaways-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 12px 14px 12px 28px;
      margin-bottom: 16px;
    }

    .takeaways-box li {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .takeaways-box li:last-child {
      margin-bottom: 0;
    }

    .summary-text {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.65;
      white-space: pre-line;
    }

    /* Empty & Loading States */
    .empty-state, .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>

  <!-- Firebase App & Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // Firebase Proje Yapılandırması
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyReplaceIfConfiguredDirectly",
      authDomain: "private-newsroom.firebaseapp.com",
      projectId: "private-newsroom",
      storageBucket: "private-newsroom.appspot.com",
      messagingSenderId: "300000000000",
      appId: "1:300000000000:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentLang = "TR";
    let currentCategory = "all";
    let articlesCache = [];

    const feedContainer = document.getElementById("feedContainer");

    // Dil Seçimi Dinleyicileri (Sadece TR ve EN)
    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentLang = btn.dataset.lang;
        renderArticles();
      });
    });

    // Kategori Filtreleme Dinleyicileri
    document.querySelectorAll(".cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.cat;
        renderArticles();
      });
    });

    // Firestore Canlı Veri Dinleyicisi
    const q = query(collection(db, "articles"), orderBy("published_at", "desc"), limit(60));
    
    onSnapshot(q, (snapshot) => {
      articlesCache = [];
      snapshot.forEach(doc => {
        articlesCache.push({ id: doc.id, ...doc.data() });
      });
      renderArticles();
    }, (error) => {
      console.warn("Firestore baglanti notu:", error);
      feedContainer.innerHTML = `<div class="empty-state">BULUT BAĞLANTISI BEKLENİYOR...</div>`;
    });

    function renderArticles() {
      feedContainer.innerHTML = "";

      const filtered = articlesCache.filter(item => {
        if (currentCategory === "all") return true;
        return item.category === currentCategory;
      });

      if (filtered.length === 0) {
        feedContainer.innerHTML = `<div class="empty-state">BU KATEGORİDE YAYINLANMIŞ İSTİHBARAT BULUNMUYOR</div>`;
        return;
      }

      filtered.forEach(art => {
        const trans = (art.translations && (art.translations[currentLang] || art.translations["TR"] || art.translations["EN"])) || {};
        const headline = trans.headline || art.original_title || "Başlık Belirtilmedi";
        const takeaways = trans.takeaways || [];
        const summary = trans.summary || "";
        const score = art.importance_score || 85;
        const isVip = art.is_vip || score >= 88;

        const card = document.createElement("article");
        card.className = `article-card ${isVip ? "vip" : ""}`;

        let takeawaysHtml = "";
        if (takeaways.length > 0) {
          takeawaysHtml = `
            <ul class="takeaways-box">
              ${takeaways.map(t => `<li>${t}</li>`).join("")}
            </ul>
          `;
        }

        card.innerHTML = `
          <div class="card-meta">
            <span class="source-tag">${art.source || art.category}</span>
            <span class="importance-badge ${score >= 90 ? 'high' : ''}">INDEX ${score}/100</span>
          </div>
          <h2 class="headline">${headline}</h2>
          ${takeawaysHtml}
          <div class="summary-text">${summary}</div>
        `;

        feedContainer.appendChild(card);
      });
    }
  </script>
</head>
<body>

  <div class="container">
    <header>
      <h1 class="brand-title">Eren & Caner</h1>
      <div class="brand-subtitle">Private Intelligence Terminal</div>
    </header>

    <div class="controls">
      <!-- Dil Seçimi (Sadece TR ve EN) -->
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="TR">TR</button>
        <button class="lang-btn" data-lang="EN">EN</button>
      </div>

      <!-- Kategori Filtresi -->
      <div class="category-filter">
        <button class="cat-btn active" data-cat="all">Tüm Akış</button>
        <button class="cat-btn" data-cat="economy">Ekonomi & Finans</button>
        <button class="cat-btn" data-cat="luxury">Lüks Maisons</button>
        <button class="cat-btn" data-cat="tech">Girişim & AI</button>
        <button class="cat-btn" data-cat="realestate">Gayrimenkul & İmar</button>
        <button class="cat-btn" data-cat="local">İzmir & Bodrum</button>
        <button class="cat-btn" data-cat="culture">Kültür & Spor</button>
      </div>
    </div>

    <!-- Haber Akışı Listesi -->
    <main id="feedContainer" class="feed-container">
      <div class="loading-state">İSTİHBARAT VERİLERİ YÜKLENİYOR...</div>
    </main>
  </div>

</body>
</html>
